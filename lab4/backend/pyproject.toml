[project]
name = "forum-backend"
version = "0.1.0"
description = "Backend for a forum dedicated to Terry Davis"
readme = "README.md"
authors = [
    { name = "AlexMayuri", email = "sasha.d1990@list.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "gunicorn>=27.0.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
